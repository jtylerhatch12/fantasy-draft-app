  state.log.push({pick:state.pick,team:team,player:p.name,pos:p.pos});
  state.pick++;
  toast(p.name+" marked taken by "+team);
  save();
}
function undo(p){
  let idx=state.mine.findIndex(x=>x.name===p.name);
  if(idx>=0) state.mine.splice(idx,1);
  state.status[p.name]="AVAILABLE";
  let li=state.log.map(x=>x.player).lastIndexOf(p.name);
  if(li>=0) state.log.splice(li,1);
  state.pick=Math.max(1,state.pick-1);
  save();
}
function undoLast(){
  if(!state.log.length){toast("Nothing to undo");return}
  const last=state.log[state.log.length-1];
  const p=PLAYERS.find(x=>x.name===last.player);
  if(p){
    state.status[p.name]="AVAILABLE";
    if(last.team===MY_TEAM){
      const idx=state.mine.findIndex(x=>x.name===p.name);
      if(idx>=0) state.mine.splice(idx,1);
    }
  }
  state.log.pop();
  state.pick=Math.max(1,state.pick-1);
  toast("Undid pick "+last.pick+": "+last.player);
  save();
}
function roundForPick(pick){return Math.floor((pick-1)/12)+1}
function slotForPick(pick){
  const offset=(pick-1)%12;
  return roundForPick(pick)%2===1 ? offset+1 : 12-offset;
}
function currentTeam(){
  return TEAMS[slotForPick(state.pick)-1];
}
function currentClock(){
  const r=roundForPick(state.pick), slot=slotForPick(state.pick);
  return {round:r,slot:slot,team:TEAMS[slot-1],isMine:TEAMS[slot-1]===MY_TEAM};
}
function pickLabel(pick){return "Pick "+pick+" • Round "+roundForPick(pick)}
function show(tab){
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 document.getElementById("n"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add("active");
 render(tab);
}
function render(tab="pick"){
 const app=document.getElementById("app");
 if(tab==="pick") renderPick(app);
 if(tab==="board") renderBoard(app);
 if(tab==="team") renderTeam(app);
 if(tab==="log") renderLog(app); if(tab==="data") renderData(app);
}
function playerButtons(p){
 const mine=currentTeam()===MY_TEAM;
 return `<div class="player"><div class="info"><div class="name">${p.name}</div><small>${p.pos} • ${p.team} • ADP ${p.adp??"—"} • Consensus ${consensusRank(p)}</small></div>
 ${mine?`<button class="draft" data-draft-player="${p.name.replaceAll('"','&quot;')}" type="button">I DRAFTED</button>`:`<button class="oppbtn" data-opp-player="${p.name.replaceAll('"','&quot;')}" type="button">TAKEN</button>`}</div>`;
}
function draftByName(n){let p=PLAYERS.find(x=>x.name===n);if(p)draft(p)}
function oppByName(n){let p=PLAYERS.find(x=>x.name===n);if(p)opp(p)}
// iPad/Safari-safe button handling: use event delegation instead of inline draft handlers.
document.addEventListener("click", function(e){
  const b=e.target.closest("button[data-draft-player],button[data-opp-player],button[data-undo-player],button[data-position-filter]");
  if(!b) return;
  if(b.dataset.positionFilter){
    pickPosFilter=b.dataset.positionFilter;
    render("pick");
    return;
  }
  const n=b.dataset.draftPlayer || b.dataset.oppPlayer || b.dataset.undoPlayer;
  const p=PLAYERS.find(x=>x.name===n);
  if(!p) return;
  if(b.dataset.draftPlayer) draft(p);
  else if(b.dataset.oppPlayer) opp(p);
  else undo(p);
});
function renderPick(app){

  app.innerHTML=`
  <div class="clock">
    <div class="label">${c.isMine?"🎯 YOUR PICK":"⏱️ ON THE CLOCK"}</div>
    <div class="team">${c.team}</div>
    <div class="detail">Pick ${state.pick} • Round ${c.round} • Draft slot ${c.slot}${c.isMine?" • This is you":""}</div>
  </div>
  <div class="card">
    <div class="grid">
      <div class="stat"><b>${state.mine.length}</b>Rostered</div>
      <div class="stat"><b>${available().length}</b>Available</div>
      <div class="stat"><b>${state.log.length}</b>Picks logged</div>
    </div>
  </div>
  <div class="card">
    <div class="sectiontitle">DRAFT ORDER — CURRENT PICK</div>
    ${TEAMS.map((team,i)=>`<div class="orderrow ${i===c.slot-1?"current":""}">
      <div class="orderpick">${i+1}</div><div class="orderteam">${team}</div>${team===MY_TEAM?'<span class="youbadge">YOU</span>':""}
    </div>`).join("")}
    <div class="why">Order reverses in even-numbered rounds.</div>
  </div>
  <div class="card">
    <button class="action undoLast" type="button" onclick="undoLast()">↩️ UNDO LAST PICK</button>
  </div>
  <div class="card">
    <div class="sectiontitle">TOP 5 PICK RECOMMENDATIONS</div>

    <div class="posfilters">
      ${["ALL","WR","RB","QB","TE"].map(pos=>`<button type="button" data-position-filter="${pos}" class="${pickPosFilter===pos?"active":""}">${pos==="ALL"?"OVERALL":pos}</button>`).join("")}
    </div>
    <div class="sectiontitle" style="margin-top:4px">${pickPosFilter==="ALL"?"TOP 5 OVERALL":"TOP 5 "+pickPosFilter}</div>
    <div class="scoreprofile"><b>VALUE-FIRST ENGINE:</b> consensus ranking is the anchor, with ADP/market value, tier strength, roster fit, and your slight WR preference used as tie-breakers. CBS scoring remains league context and does <b>not</b> override the ranking. Consensus ranks are unique and ordered. Draft value is recalculated at the live pick for whoever is on the clock.</div>
    ${picks.map((p,i)=>{ return `<div class="pick ${i===0?"best":""}">
      <div class="pickrow"><div class="num">${i+1}</div><div class="pname">${p.name}</div><span class="tag">${p.pos}</span><span class="tag">T${p.tier||"?"}</span></div>
      <div class="why">${why(p,i)}</div>
      ${playerSnapshot(p)}
      ${c.isMine?`<button class="action" data-draft-player="${p.name.replaceAll('"','&quot;')}" type="button">DRAFT ${p.name.toUpperCase()}</button>`:`<button class="action opp" data-opp-player="${p.name.replaceAll('"','&quot;')}" type="button">MARK TAKEN — ${p.name.toUpperCase()}</button>`}
    </div>`}).join("")}
  </div>
  <div class="card">
    <div class="sectiontitle">POSITION CHECK — MY TEAM</div>
    ${Object.keys(t).map(pos=>`<span class="tag" style="display:inline-block;margin:3px">${pos}: ${posCount(pos)}/${t[pos]}</span>`).join("")}
  </div>
  <div class="card">
  <div class="sectiontitle">📊 PLAYER DATA / CONSENSUS</div>
  <div class="grid">
    <div class="stat"><b>${SNAPSHOT.format}</b>Format</div>
    <div class="stat"><b>${SNAPSHOT.asOf}</b>Data date</div>
    <div class="stat"><b>2</b>Market checks</div>
  </div>
  <div class="why"><b>Consensus engine:</b> ${SNAPSHOT.consensus}. <b>Market check:</b> ${SNAPSHOT.market}.</div><div class="why"><b>Status:</b> ${DATA_STATUS}</div>
  <div class="why">${SNAPSHOT.sources}</div>
  <div class="why">${SNAPSHOT.note}</div>
</div>`;
}
function positionalRank(p){
  const pool=PLAYERS.filter(x=>x.pos===p.pos).sort((a,b)=>consensusRank(a)-consensusRank(b));
  return pool.findIndex(x=>x.name===p.name)+1;
}
function draftValue(p){
  const pick=Number(state.pick)||1;
  const cr=consensusRank(p);
  const adp=Number(p.adp);
  const consensusValue=pick-cr;
  const adpValue=Number.isFinite(adp)&&adp>0 ? pick-adp : null;
  return {pick,cr,adp,consensusValue,adpValue};
}
function valueAssessment(p){
  const v=draftValue(p);
  if(v.adpValue===null) return {label:"CONSENSUS VALUE",cls:"valueFair"};
  const avg=(v.consensusValue*0.6)+(v.adpValue*0.4);
  if(avg>=7) return {label:"STRONG VALUE",cls:"valueStrong"};
  if(avg>=3) return {label:"GOOD VALUE",cls:"valueStrong"};
  if(avg>-2) return {label:"FAIR VALUE",cls:"valueFair"};
  return {label:"PREMIUM / REACH",cls:"valueReach"};
}
function playerSnapshot(p){
  const v=draftValue(p), pr=positionalRank(p);
  const cv=(v.consensusValue>=0?"+":"")+v.consensusValue.toFixed(0);
  const av=v.adpValue===null?"—":(v.adpValue>=0?"+":"")+v.adpValue.toFixed(1);
  const adpText=v.adp>0?v.adp.toFixed(1):"—";
  const label=valueAssessment(p);
  return `<div class="playerSnapshot"><div class="miniStat"><b>#${v.cr}</b><span>CONSENSUS</span></div><div class="miniStat"><b>#${pr}</b><span>${p.pos} RANK</span></div><div class="miniStat"><b>${adpText}</b><span>ADP</span></div><div class="miniStat"><b class="dualValue">ADP ${av} • CONS ${cv}</b><span>VALUE AT PICK ${v.pick}</span></div></div><span class="valueLabel ${label.cls}">${label.label}</span>`;
}
function why(p,i){
 if(i===0) return "BEST OVERALL VALUE: strongest combination of consensus rank, market value, tier strength, and roster fit. This is the player I'd take unless you have a specific reason to pivot.";
 if(p.pos==="WR") return "Full PPR + your slight WR preference makes this a strong alternative, especially if the player is falling below his market value.";
 if(p.pos==="RB") return "RB volume and the league's 0.1 points per rushing attempt add floor. Strong option if the value gap is close.";
 if(p.pos==="TE") return "TE scarcity can create an advantage. Consider him when an elite tier is about to disappear.";
 if(p.pos==="QB") return "Six-point passing TDs increase QB scoring. Take the elite value when it falls; don't force QB early.";
 return "Strong value based on your current board and roster.";
}
function renderBoard(app){

 app.innerHTML=`<div class="clock"><div class="label">${c.isMine?"🎯 YOUR PICK":"⏱️ ON THE CLOCK"}</div><div class="team">${c.team}</div><div class="detail">Pick ${state.pick} • Round ${c.round} • Draft slot ${c.slot}</div></div>
 <div class="card"><button class="action undoLast" type="button" onclick="undoLast()">↩️ UNDO LAST PICK</button></div>

 <input class="search" id="search" placeholder="Search player..." oninput="filterBoard()">

function filterBoard(){

 const el=document.getElementById("boardList"); if(!el)return;
 el.innerHTML=list.length?list.map(playerButtons).join(""):"<div class='muted'>No available players match.</div>";

function renderTeam(app){
 app.innerHTML=`<div class="clock"><div class="label">YOUR TEAM</div><div class="team">${MY_TEAM}</div><div class="detail">Current pick: ${state.pick} • ${currentTeam()} is on the clock</div></div>
 <div class="card"><button class="action undoLast" type="button" onclick="undoLast()">↩️ UNDO LAST PICK</button></div>

 <div class="card">${state.mine.length?state.mine.map((p,i)=>`<div class="player"><div class="info"><div class="name">${i+1}. ${p.name}</div><small>${p.pos} • ${p.team}</small></div><button class="undo" data-undo-player="${p.name.replaceAll('"','&quot;')}" type="button">UNDO THIS</button></div>`).join(""):"<div class='muted'>Nothing drafted yet.</div>"}</div>

}
function undoByName(n){let p=PLAYERS.find(x=>x.name===n);if(p)undo(p)}
function renderLog(app){
 const c=currentClock();

 ${state.log.length?state.log.slice().reverse().map(x=>`<div class="player"><div class="info"><div class="name">Pick ${x.pick}: ${x.player}</div><small>${x.team} • ${x.pos}</small></div></div>`).join(""):"<div class='muted' style='margin-top:12px'>No picks logged yet.</div>"}

  const list=PLAYERS.slice().sort((a,b)=>(a.rank||999)-(b.rank||999));

  <div class="card" id="dataList"></div>`;
  filterData();
}
function filterData(){
 const q=(document.getElementById("dataSearch")?.value||"").toLowerCase();
 const list=PLAYERS.filter(p=>(p.name+" "+p.pos+" "+p.team).toLowerCase().includes(q))
   .sort((a,b)=>(a.rank||999)-(b.rank||999)).slice(0,200);
 const el=document.getElementById("dataList"); if(!el)return;
 el.innerHTML=list.map(p=>`<div class="player"><div class="info"><div class="name">${p.rank??"—"}. ${p.name}</div><small>${p.pos} • ${p.team} • ADP ${p.adp??"—"} • Consensus ${consensusRank(p)} • Tier ${p.tier||"—"}</small></div><span class="tag">${(state.status[p.name]||"AVAILABLE")}</span></div>`).join("");
}

function resetDraft(){if(confirm("Reset the entire draft?")){localStorage.removeItem(KEY);state={status:{},mine:[],log:[],pick:1};render("pick")}}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1500)}
render("pick");
refreshData(true);
</script>
