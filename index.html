"tier": ""}, {"name": "Jaydon Blue", "pos": "RB", "team": "DAL", "adp": 169.0, "rank": 169.0, "tier": ""}, {"name": "Seattle Seahawks", "pos": "DST", "team": "SEA", "adp": 162.0, "rank": 162.0, "tier": ""}, {"name": "Brandon Aubrey", "pos": "K", "team": "DAL", "adp": 166.0, "rank": 166.0, "tier": ""}, {"name": "Samaje Perine", "pos": "RB", "team": "CIN", "adp": 0.0, "rank": 999, "tier": ""}, {"name": "Cameron Dicker", "pos": "K", "team": "LAC", "adp": 183.0, "rank": 183.0, "tier": ""}, {"name": "Oronde Gadsden", "pos": "TE", "team": "LAC", "adp": 170.5, "rank": 170.5, "tier": ""}, {"name": "Minnesota Vikings", "pos": "DST", "team": "MIN", "adp": 179.0, "rank": 179.0, "tier": ""}, {"name": "Jaylin Noel", "pos": "WR", "team": "HOU", "adp": 225.5, "rank": 225.5, "tier": ""}, {"name": "Kayshon Boutte", "pos": "WR", "team": "NE", "adp": 205.0, "rank": 205.0, "tier": ""}, {"name": "George Holani", "pos": "RB", "team": "SEA", "adp": 207.0, "rank": 207.0, "tier": ""}]; const SNAPSHOT = {"asOf": "August 19, 2026", "source": "CBS Sports PPR ADP snapshot + FantasyPros consensus context", "note": "Top-12 ADP refreshed from CBS's current PPR snapshot. Full player pool is embedded locally; rankings/ADP should be refreshed again immediately before your draft."};
const KEY="tylerFantasyDraft2026_v3";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{status:{},mine:[],log:[],pick:3};
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function posCount(p){return state.mine.filter(x=>x.pos===p).length}
function targets(){return {QB:2,RB:5,WR:6,TE:1,PK:1,TD:1}}
function available(){return PLAYERS.filter(p=>(state.status[p.name]||"AVAILABLE")==="AVAILABLE")}
function score(p){
  let s=100-(p.rank||200);
  if(p.adp) s += Math.max(-10,Math.min(12,(p.adp-(p.rank||p.adp))*0.65));
  // Slight WR preference, but value remains primary.
  if(p.pos==="WR") s+=3;
  if(p.pos==="RB") s+=2;
  if(p.pos==="TE") s+=1;
  // Encourage roster balance without forcing quotas.
  let t=targets()[p.pos]||0, c=posCount(p.pos);
  if(t && c>=t) s-=10;
  if(p.pos==="QB" && c>=1) s-=2;
  // Tier bonus
  if(String(p.tier)==="1") s+=4;
  if(String(p.tier)==="2") s+=2;
  return s;
}
function top5(){return available().sort((a,b)=>score(b)-score(a)).slice(0,5)}
function draft(p){
 state.status[p.name]="MINE"; state.mine.push(p); state.log.push({pick:state.pick,team:"YOU",player:p.name,pos:p.pos});
 state.pick++;
 toast(p.name+" added to My Team"); save();
}
function opp(p){
 state.status[p.name]="TAKEN"; state.log.push({pick:state.pick,team:"Opponent",player:p.name,pos:p.pos});
 state.pick++; toast(p.name+" marked taken"); save();
}
function undo(p){
 let idx=state.mine.findIndex(x=>x.name===p.name);
 if(idx>=0){state.mine.splice(idx,1);state.status[p.name]="AVAILABLE"}
 else state.status[p.name]="AVAILABLE";
 let li=state.log.map(x=>x.player).lastIndexOf(p.name); if(li>=0) state.log.splice(li,1);
 state.pick=Math.max(3,state.pick-1); save();
}
function show(tab){
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 document.getElementById("n"+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add("active");
 render(tab);
}
function render(tab="pick"){
 const app=document.getElementById("app");
 if(tab==="pick") renderPick(app);
 if(tab==="board") renderBoard(app);
 if(tab==="team") renderTeam(app);
 if(tab==="log") renderLog(app); if(tab==="data") renderData(app);
}
function playerButtons(p){
 return `<div class="player"><div class="info"><div class="name">${p.name}</div><small>${p.pos} • ${p.team} • ADP ${p.adp??"—"} • Rank ${p.rank??"—"}</small></div>
 <button class="draft" data-draft-player="${p.name.replaceAll('"','&quot;')}" type="button">I DRAFTED</button>
 <button class="oppbtn" data-opp-player="${p.name.replaceAll('"','&quot;')}" type="button">TAKEN</button></div>`;
}
function draftByName(n){let p=PLAYERS.find(x=>x.name===n);if(p)draft(p)}
function oppByName(n){let p=PLAYERS.find(x=>x.name===n);if(p)opp(p)}
// iPad/Safari-safe button handling: use event delegation instead of inline draft handlers.
document.addEventListener("click", function(e){
  const b=e.target.closest("button[data-draft-player],button[data-opp-player],button[data-undo-player]");
  if(!b) return;
  const n=b.dataset.draftPlayer || b.dataset.oppPlayer || b.dataset.undoPlayer;
  const p=PLAYERS.find(x=>x.name===n);
  if(!p) return;
  if(b.dataset.draftPlayer) draft(p);
  else if(b.dataset.oppPlayer) opp(p);
  else undo(p);
});
function renderPick(app){
 const picks=top5(), t=targets();
 app.innerHTML=`<div class="card"><div class="muted">YOU ARE ON PICK</div><div class="big">${state.pick}</div>
 <div class="grid" style="margin-top:10px"><div class="stat"><b>${state.mine.length}</b>Rostered</div><div class="stat"><b>${available().length}</b>Available</div><div class="stat"><b>${state.log.length}</b>Picks logged</div></div></div>
 <div class="card"><div class="sectiontitle">TOP 5 — RIGHT NOW</div>${picks.map((p,i)=>`<div class="pick ${i===0?"best":""}">
 <div class="pickrow"><div class="num">${i+1}</div><div class="pname">${p.name}</div><span class="tag">${p.pos}</span><span class="tag">T${p.tier||"?"}</span></div>
 <div class="why">${why(p,i)}</div>
 <button class="action" data-draft-player="${p.name.replaceAll('"','&quot;')}" type="button">DRAFT ${p.name.toUpperCase()}</button></div>`).join("")}
 </div>
 <div class="card"><div class="sectiontitle">POSITION CHECK</div>${Object.keys(t).map(pos=>`<span class="tag" style="display:inline-block;margin:3px">${pos}: ${posCount(pos)}/${t[pos]}</span>`).join("")}</div>
 <div class="card"><div class="muted">Data snapshot</div><b>${SNAPSHOT.asOf}</b><div class="why">${SNAPSHOT.note}</div></div>`;
}
function why(p,i){
 if(i===0) return "BEST OVERALL VALUE: strong rank/ADP value, tier position, and fit with your roster. This is the player I'd take unless you have a specific reason to pivot.";
 if(p.pos==="WR") return "Full PPR + your slight WR preference makes this a strong alternative, especially if the player is falling below his market value.";
 if(p.pos==="RB") return "RB volume and the league's 0.1 points per rushing attempt add floor. Strong option if the value gap is close.";
 if(p.pos==="TE") return "TE scarcity can create an advantage. Consider him when an elite tier is about to disappear.";
 if(p.pos==="QB") return "Six-point passing TDs increase QB scoring. Take the elite value when it falls; don't force QB early.";
 return "Strong value based on your current board and roster.";
}
function renderBoard(app){
 app.innerHTML=`<div class="card"><div class="sectiontitle">DRAFT BOARD</div>
 <input class="search" id="search" placeholder="Search player..." oninput="filterBoard()">
 <div class="why">Tap <b>I DRAFTED</b> for your pick. Tap <b>TAKEN</b> when an opponent selects him.</div>
 </div><div class="card" id="boardList"></div>`;
 filterBoard();
}
function filterBoard(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();
 const list=PLAYERS.filter(p=>(p.name+" "+p.pos+" "+p.team).toLowerCase().includes(q) && (state.status[p.name]||"AVAILABLE")==="AVAILABLE")
   .sort((a,b)=> (a.rank||999)-(b.rank||999)).slice(0,100);
 const el=document.getElementById("boardList"); if(!el)return;
 el.innerHTML=list.length?list.map(playerButtons).join(""):"<div class='muted'>No available players match.</div>";
}
function renderTeam(app){
 app.innerHTML=`<div class="card"><div class="sectiontitle">MY TEAM</div>
 <div class="grid"><div class="stat"><b>${state.mine.length}</b>Total</div><div class="stat"><b>${posCount("WR")}</b>WR</div><div class="stat"><b>${posCount("RB")}</b>RB</div></div></div>
 <div class="card">${state.mine.length?state.mine.map((p,i)=>`<div class="player"><div class="info"><div class="name">${i+1}. ${p.name}</div><small>${p.pos} • ${p.team}</small></div><button class="undo" data-undo-player="${p.name.replaceAll('"','&quot;')}" type="button">UNDO</button></div>`).join(""):"<div class='muted'>Nothing drafted yet. Use I DRAFTED on the Pick screen or Draft Board.</div>"}</div>
 <div class="card"><div class="sectiontitle">ROSTER TARGETS</div>${Object.entries(targets()).map(([p,n])=>`<div style="padding:6px 0"><b>${p}</b>: ${posCount(p)} / ${n}</div>`).join("")}</div>`;
}
function undoByName(n){let p=PLAYERS.find(x=>x.name===n);if(p)undo(p)}
function renderLog(app){
 app.innerHTML=`<div class="card"><div class="sectiontitle">DRAFT LOG</div>
 <div class="why">Your picks and opponent selections are stored on this iPad.</div>
 ${state.log.length?state.log.slice().reverse().map(x=>`<div class="player"><div class="info"><div class="name">Pick ${x.pick}: ${x.player}</div><small>${x.team} • ${x.pos}</small></div></div>`).join(""):"<div class='muted' style='margin-top:12px'>No picks logged yet.</div>"}
 <button class="action" type="button" onclick="resetDraft()">RESET DRAFT</button></div>`;
}

function renderData(app){
 const list=PLAYERS.slice().sort((a,b)=>(a.rank||999)-(b.rank||999));
 app.innerHTML=`<div class="card"><div class="sectiontitle">PLAYER DATABASE (${list.length})</div>
 <div class="why">This version has the player data embedded directly in the app. Top CBS PPR ADP values are refreshed through Aug. 19, 2026.</div>
 <input class="search" id="dataSearch" placeholder="Search player..." oninput="filterData()"></div>
 <div class="card" id="dataList"></div>`;
 filterData();
}
function filterData(){
 const q=(document.getElementById("dataSearch")?.value||"").toLowerCase();
 const list=PLAYERS.filter(p=>(p.name+" "+p.pos+" "+p.team).toLowerCase().includes(q))
   .sort((a,b)=>(a.rank||999)-(b.rank||999)).slice(0,200);
 const el=document.getElementById("dataList"); if(!el)return;
 el.innerHTML=list.map(p=>`<div class="player"><div class="info"><div class="name">${p.rank??"—"}. ${p.name}</div><small>${p.pos} • ${p.team} • ADP ${p.adp??"—"} • Tier ${p.tier||"—"}</small></div><span class="tag">${(state.status[p.name]||"AVAILABLE")}</span></div>`).join("");
}

function resetDraft(){if(confirm("Reset the entire draft?")){localStorage.removeItem(KEY);state={status:{},mine:[],log:[],pick:3};render("pick")}}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1500)}
render("pick");
</script>
