  // Positive draft value means the player is falling below his market;

  // Version 24: estimate the player's draft-position distribution instead of
  // treating ADP as a deterministic pick. Prefer an actual ADP standard
  // deviation when the live snapshot supplies one; otherwise use the
  // published high/low range (range/4) and finally a conservative ADP-based

function playerSnapshot(p){
  const v=draftValue(p), pr=positionalRank(p);
  const cv=(v.consensusValue>=0?"+":"")+v.consensusValue.toFixed(0);
  const av=v.adpValue===null?"—":(v.adpValue>=0?"+":"")+v.adpValue.toFixed(1);
  const adpText=v.adp>0?v.adp.toFixed(1):"—";
  const dv=(v.value>=0?"+":"")+v.value.toFixed(1);
  const vorp=Number.isFinite(Number(p.vorp))?Number(p.vorp).toFixed(1):"—";
  const vorpSource=p.vorpSource==="FantasyPros fallback"?"FP":(p.vorpSource==="The Athletic"?"ATH":"—");
  const label=valueAssessment(p);
  const va=vorpAssessment(p);

  return `<div class="playerSnapshot">
    <div class="miniStat"><b>#${v.cr}</b><span>CONSENSUS</span></div>
    <div class="miniStat"><b>#${athleticPosRank(p)}</b><span>ATHLETIC POS</span></div>
    <div class="miniStat"><b>${adpText}</b><span>ADP</span></div>
    <div class="miniStat"><b>${vorp} <em class="vorpDot ${va.cls}">${va.label}</em></b><span>VORP • ${vorpSource}</span></div>
    <div class="miniStat"><b class="dualValue">${dv}</b><span>DRAFT VALUE</span></div>
  </div>
  <div class="why" style="margin-top:7px;font-size:11px">
    ADP ${av} • CONS ${cv} • Value at pick ${v.pick}
  </div>
  <div class="valueExplain">Draft Value = weighted market value at this exact pick. <b>Positive is good.</b> Athletic tier = positional projection band from the supplied Athletic POS. PROJ. tiers.</div>
  <span class="valueLabel ${label.cls}">${label.label}</span>
  ${(()=>{const a=nextPickAvailability(p); return `<div class="availability ${a.cls}"><span>⏭️ NEXT PICK</span><span class="pct">${a.pctText||"—"}</span><span>${a.label||"availability estimate"}</span><span class="availTiny">Pick #${a.next}</span></div><div class="availModel">Estimated from ADP distribution${a.source&&a.source!=="ADP spread"?` • ${a.source}`:""}; conditioned on being available now.</div>`})()}`;
}

function positionClass(pos){
  return "pos"+String(pos||"").replace(/[^A-Za-z]/g,"");
}

// The Athletic POS. PROJ. screenshots supplied by Tyler show these
// positional tier bands:
// QB: T1 1-3, T2 4-6, T3 7-16, T4 17-24
// RB: T1 1-2, T2 3-8, T3 9-18, T4 19-30
// WR: T1 1-3, T2 4-10, T3 11-28, T4 29-39
// TE: T1 1-3, T2 4-11, T3 12-19, T4 20-25
// The next band shown by The Athletic is T5 (blue).
const ATHLETIC_TIER_BREAKS={
  QB:[3,6,16,24],
  RB:[2,8,18,30],
  WR:[3,10,28,39],
  TE:[3,11,19,25]
};

function athleticPosRank(p){
  const ar=Number(p.athleticPosRank);
  return Number.isFinite(ar)&&ar>0 ? ar : positionalRank(p);
}

function athleticTier(p){
  const breaks=ATHLETIC_TIER_BREAKS[p.pos];
  if(!breaks) return null;
  const r=athleticPosRank(p);
  if(!Number.isFinite(r)||r<=0) return null;
  if(r<=breaks[0]) return 1;
  if(r<=breaks[1]) return 2;
  if(r<=breaks[2]) return 3;
  if(r<=breaks[3]) return 4;
  return 5;
}

function tierClass(t){
  return t ? "tier"+t : "tierNA";
}

function tierLabel(p){
  const t=athleticTier(p);
  return t ? "T"+t : "—";
}

function why(p,i){
 if(i===0) return "BEST OVERALL VALUE: strongest combination of consensus rank, market value, tier strength, and roster fit. This is the player I'd take unless you have a specific reason to pivot.";
 if(p.pos==="WR") return "Full PPR + your slight WR preference makes this a strong alternative, especially if the player is falling below his market value.";
 if(p.pos==="RB") return "RB volume and the league's 0.1 points per rushing attempt add floor. Strong option if the value gap is close.";
 if(p.pos==="TE") return "TE scarcity can create an advantage. Consider him when an elite tier is about to disappear.";
 if(p.pos==="QB") return "Six-point passing TDs increase QB scoring. Take the elite value when it falls; don't force QB early.";
 return "Strong value based on your current board and roster.";
}
function renderBoard(app){
 const c=currentClock();
 app.innerHTML=`<div class="clock"><div class="label">${c.isMine?"🎯 YOUR PICK":"⏱️ ON THE CLOCK"}</div><div class="team">${c.team}</div><div class="detail">Pick ${state.pick} • Round ${c.round} • Draft slot ${c.slot}</div></div>
 <div class="card"><button class="action undoLast" type="button" onclick="undoLast()">↩️ UNDO LAST PICK</button></div>
 <div class="card"><div class="sectiontitle">DRAFT BOARD</div>
 <input class="search" id="search" placeholder="Search player..." oninput="filterBoard()">
 <div class="why">On your pick, tap <b>I DRAFTED</b>. For an opponent pick, tap <b>TAKEN</b>.</div>
 </div><div class="card" id="boardList"></div>`;
 filterBoard();
}
function filterBoard(){
 const q=(document.getElementById("search")?.value||"").toLowerCase();
 const list=PLAYERS.filter(p=>(p.name+" "+p.pos+" "+p.team).toLowerCase().includes(q) && (state.status[p.name]||"AVAILABLE")==="AVAILABLE")
   .sort((a,b)=> (a.rank||999)-(b.rank||999)).slice(0,100);
 const el=document.getElementById("boardList"); if(!el)return;
 el.innerHTML=list.length?list.map(playerButtons).join(""):"<div class='muted'>No available players match.</div>";
}
function renderTeam(app){
 app.innerHTML=`<div class="clock"><div class="label">YOUR TEAM</div><div class="team">${MY_TEAM}</div><div class="detail">Current pick: ${state.pick} • ${currentTeam()} is on the clock</div></div>
 <div class="card"><button class="action undoLast" type="button" onclick="undoLast()">↩️ UNDO LAST PICK</button></div>
 <div class="card"><div class="sectiontitle">MY TEAM</div>
 <div class="grid"><div class="stat"><b>${state.mine.length}</b>Total</div><div class="stat"><b>${posCount("WR")}</b>WR</div><div class="stat"><b>${posCount("RB")}</b>RB</div></div></div>
 <div class="card">${state.mine.length?state.mine.map((p,i)=>`<div class="player"><div class="info"><div class="name">${i+1}. ${p.name}</div><small>${p.pos} • ${p.team}</small></div><button class="undo" data-undo-player="${p.name.replaceAll('"','&quot;')}" type="button">UNDO THIS</button></div>`).join(""):"<div class='muted'>Nothing drafted yet.</div>"}</div>
 <div class="card"><div class="sectiontitle">ROSTER TARGETS</div>${Object.entries(targets()).map(([p,n])=>`<div style="padding:6px 0"><b>${p}</b>: ${posCount(p)} / ${n}</div>`).join("")}</div>`;
}
function undoByName(n){let p=PLAYERS.find(x=>x.name===n);if(p)undo(p)}
function renderLog(app){
 const c=currentClock();
 app.innerHTML=`<div class="clock"><div class="label">${c.isMine?"🎯 YOUR PICK":"⏱️ ON THE CLOCK"}</div><div class="team">${c.team}</div><div class="detail">Pick ${state.pick} • Round ${c.round}</div></div>
 <div class="card"><button class="action undoLast" type="button" onclick="undoLast()">↩️ UNDO LAST PICK</button></div>
 <div class="card"><div class="sectiontitle">DRAFT LOG</div>
 <div class="why">Your picks and opponent selections are stored on this iPad.</div>
 ${state.log.length?state.log.slice().reverse().map(x=>`<div class="player"><div class="info"><div class="name">Pick ${x.pick}: ${x.player}</div><small>${x.team} • ${x.pos}</small></div></div>`).join(""):"<div class='muted' style='margin-top:12px'>No picks logged yet.</div>"}
 <button class="action" type="button" onclick="resetDraft()">RESET DRAFT</button></div>`;
}

function renderData(app){
  const list=PLAYERS.slice().sort((a,b)=>(a.rank||999)-(b.rank||999));
  app.innerHTML=`<div class="card"><div class="sectiontitle">PLAYER DATA & REFRESH</div>
  <button class="action" id="refreshDataBtn" type="button" onclick="refreshData(false)">🔄 REFRESH PLAYER DATA</button>
  <div class="why"><b>Status:</b> ${DATA_STATUS}</div>
  <div class="why"><b>Data date:</b> ${SNAPSHOT.asOf}. <b>Sources:</b> ${SNAPSHOT.sources}</div><div class="why"><b>VORP priority:</b> The Athletic first; FantasyPros 2026 12-team PPR VORP is used only as a fallback when Athletic VORP is missing. The two scales are never blended.</div>
  <div class="why"><b>Athletic tiers:</b> positional projection bands mapped from the POS. PROJ. colors/ranges in your supplied screenshots.</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="action" style="display:inline-block;text-decoration:none" href="https://www.fantasypros.com/nfl/adp/ppr-overall.php" target="_blank">FantasyPros ADP</a><a class="action" style="display:inline-block;text-decoration:none" href="https://fantasyfootballcalculator.com/adp/ppr" target="_blank">FFC 12-Team ADP</a></div></div><div class="card"><input class="search" id="dataSearch" placeholder="Search player..." oninput="filterData()"></div>
  <div class="card" id="dataList"></div>`;
  filterData();
}
function filterData(){
 const q=(document.getElementById("dataSearch")?.value||"").toLowerCase();
 const list=PLAYERS.filter(p=>(p.name+" "+p.pos+" "+p.team).toLowerCase().includes(q))
   .sort((a,b)=>(a.rank||999)-(b.rank||999)).slice(0,200);
 const el=document.getElementById("dataList"); if(!el)return;
 el.innerHTML=list.map(p=>`<div class="player"><div class="info"><div class="name">${p.rank??"—"}. ${p.name}</div><small>${p.pos} • ${p.team} • ADP ${p.adp??"—"} • Consensus ${consensusRank(p)} • VORP ${Number.isFinite(Number(p.vorp))?Number(p.vorp).toFixed(1):"—"} (${p.vorpSource==="FantasyPros fallback"?"FP fallback":p.vorpSource==="The Athletic"?"Athletic":"—"}) • Athletic POS #${athleticPosRank(p)} • Tier ${tierLabel(p)}</small></div><span class="tag">${(state.status[p.name]||"AVAILABLE")}</span></div>`).join("");
}

function resetDraft(){if(confirm("Reset the entire draft?")){localStorage.removeItem(KEY);state={status:{},mine:[],log:[],pick:1};render("pick")}}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1500)}
render("pick");
refreshData(true);
</script>
